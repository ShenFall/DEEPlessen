name: 构建安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npm run build

      - name: 安装 Capacitor
        run: npm i -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync android

      - name: 生成应用图标与启动图
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F7F4EE' --splashBackgroundColor '#F7F4EE'

      - name: 编译 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: shenshi-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
