<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>没有这一页 · ShenFall</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
:root{--bg:#f6f3ec;--ink:#171b22;--dim:#5c6472;--line:rgba(23,27,34,.14);--gold:#8c5a20;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Songti SC",serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a0e16;--ink:#e9e7e1;--dim:#98a1b0;
  --line:rgba(255,255,255,.14);--gold:#d8a05c}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;
  background:var(--bg);color:var(--ink);font:16px/1.75 var(--sans)}
.box{max-width:440px;width:100%}
.k{font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:.2em;color:var(--gold);
  margin:0 0 18px}
h1{margin:0 0 14px;font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.02em}
p{margin:0 0 28px;color:var(--dim)}
a{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:1px solid var(--line);
  border-radius:9px;color:inherit;text-decoration:none;font-size:14px}
a:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
  <div class="box">
    <p class="k">404 / NOT FOUND</p>
    <h1>这一页不在了。</h1>
    <p>可能是地址改了，也可能从来没有过。</p>
    <a href="/">回首页</a>
  </div>
</body>
</html>
